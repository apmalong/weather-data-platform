version: 2

models:
  - name: int_stations__selected
    description: One row per configured city, with the station resolved from NOAA's metadata.
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: city
        data_tests: [unique, not_null]
      - name: country_name
        data_tests: [not_null]
      - {name: network_code, description: "{{ doc('network_code') }}"}
      - {name: wmo_id, description: "{{ doc('wmo_id') }}"}

  - name: int_elements__in_scope
    description: Elements the selected stations report in the window, per the inventory and readme catalog.
    columns:
      - name: element
        data_tests: [unique, not_null]
      - name: unit
        data_tests: [not_null]
      - {name: scale, description: "{{ doc('scale') }}"}
      - {name: is_core, description: "{{ doc('is_core') }}"}
      - {name: absent_means_zero, description: "{{ doc('absent_means_zero') }}"}
      - {name: persistent, description: "{{ doc('persistent') }}"}
      - {name: fed_by, description: The element that adds to a persistent one (SNOW for SNWD).}
      - {name: lower_bound, description: "{{ doc('bounds') }}"}
      - {name: upper_bound, description: "{{ doc('bounds') }}"}
      - {name: display_unit, description: "{{ doc('display_unit') }}"}
      - {name: policy_hash, description: "{{ doc('policy_hash') }}"}

  - name: int_station_elements__reported
    description: The years each selected station reports each element, from the inventory.
    data_tests:
      - unique_combination: {arguments: {columns: [station_id, element]}}
    columns:
      - {name: first_year, description: "{{ doc('first_last_year') }}"}
      - {name: last_year, description: "{{ doc('first_last_year') }}"}

  - name: int_observations__assessed
    description: Observations for the selected stations, scaled and given a quality status. Nothing is dropped.
    data_tests:
      - unique_combination: {arguments: {columns: [station_id, obs_date, element]}}
    columns:
      - name: quality_status
        description: "{{ doc('quality_status') }}"
        data_tests:
          - accepted_values: {arguments: {values: [valid, trace, qc_failed, out_of_bounds, inconsistent, unparseable]}}
      - {name: raw_value, description: "{{ doc('raw_value') }}"}
      - {name: value, description: "{{ doc('value') }}"}
      - {name: mflag, description: "{{ doc('mflag') }}"}
      - {name: qflag, description: "{{ doc('qflag') }}"}
      - {name: sflag, description: "{{ doc('sflag') }}"}
      - {name: is_trace, description: "{{ doc('is_trace') }}"}
      - {name: policy_hash, description: "{{ doc('policy_hash') }}"}
      - {name: raw_changed_at, description: "{{ doc('raw_changed_at') }}"}
      - {name: raw_run_id, description: "{{ doc('raw_run_id') }}"}

unit_tests:
  # A source error NOAA's checks didn't flag is quarantined, not left to fail a test and stop the build.
  - name: inverted_tmax_tmin_is_quarantined_not_fatal
    model: int_observations__assessed
    given:
      - input: ref('stg_ghcnd__observations')
        rows:
          - {station_id: S1, obs_date: 2026-09-01, element: TMAX, raw_value: 150}   # 15.0 below 20.1: inverted
          - {station_id: S1, obs_date: 2026-09-01, element: TMIN, raw_value: 201}
          - {station_id: S1, obs_date: 2026-09-02, element: TMAX, raw_value: 250}   # a normal day
          - {station_id: S1, obs_date: 2026-09-02, element: TMIN, raw_value: 120}
          - {station_id: S1, obs_date: 2026-09-03, element: TMAX, raw_value: 150}   # inverted, but NOAA already
          - {station_id: S1, obs_date: 2026-09-03, element: TMIN, raw_value: 201, qflag: I}   # flagged TMIN
      - input: ref('int_stations__selected')
        rows:
          - {station_id: S1}
      - input: ref('int_elements__in_scope')
        rows:
          - {element: TMAX, scale: 0.1, unit: degrees C, lower_bound: -60, upper_bound: 50}
          - {element: TMIN, scale: 0.1, unit: degrees C, lower_bound: -60, upper_bound: 50}
    expect:
      rows:
        - {obs_date: 2026-09-01, element: TMAX, quality_status: inconsistent}
        - {obs_date: 2026-09-01, element: TMIN, quality_status: inconsistent}
        - {obs_date: 2026-09-02, element: TMAX, quality_status: valid}
        - {obs_date: 2026-09-02, element: TMIN, quality_status: valid}
        - {obs_date: 2026-09-03, element: TMAX, quality_status: valid}
        - {obs_date: 2026-09-03, element: TMIN, quality_status: qc_failed}
