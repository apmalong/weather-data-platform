name: weather
version: "1.0.0"
profile: weather
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  weather:
    # Descriptions from the YAML (and _docs.md) become table and column comments in the warehouse,
    # visible with `describe` and in `wx --explore`.
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

tests:
  weather:
    +store_failures: true        # failing rows land in a dbt_test__audit schema for inspection
    +schema: audit

# Every dbt invocation and node result goes to ops.dbt_runs / ops.dbt_node_runs (observability).
on-run-end:
  - "{{ record_run_results(results) }}"
  - "{{ persist_source_docs() }}"
