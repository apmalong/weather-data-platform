# The only file to edit to change what the pipeline covers. Adding a city is one entry under
# `cities`: the station is resolved from NOAA's metadata, its elements come from the inventory,
# and dbt and the narratives pick it up without code or SQL changes.

source:
  base_url: https://www.ncei.noaa.gov/pub/data/ghcn/daily
  # Reference files, all loaded into the warehouse (requirement 2).
  reference_files:
    stations: ghcnd-stations.txt
    inventory: ghcnd-inventory.txt
    countries: ghcnd-countries.txt
    states: ghcnd-states.txt
    readme: readme.txt
    status: status.txt          # NOAA's change log; explains revisions like v3.35's new Canadian IDs

# Dates covered downstream of raw. Raw keeps each station's full history as published.
window:
  last_days: 730                # two years back from today; or set `start` / `end` (YYYY-MM-DD) instead

stations:
  country: CA
  # How a city's station is chosen from ghcnd-stations.txt and ghcnd-inventory.txt.
  # 1. The city's airport: a name like "<CITY> ... A" (Environment Canada) or "... AP" (NOAA, US),
  #    preferring the international one.
  # 2. Its station: the airport's own if it reports every required element across the window,
  #    otherwise the nearest station that does within max_distance_km (newer Canadian airport
  #    stations often skip precipitation, which a climate station beside them reports).
  selection:
    airport_name_pattern: ' (A|AP|INT)$'     # INT: a name cut off at NOAA's 30 characters
    preferred_name_pattern: '\bINT(L|''L|ERCONTINENTAL)?\b'   # INTL, INT'L, INTERCONTINENTAL, cut-off INT
    required_elements: [TMAX, TMIN, PRCP]
    max_distance_km: 5
  # Quote province codes: YAML reads a bare ON as the boolean true.
  cities:
    - {city: Toronto, province: 'ON'}
    - {city: Montreal, province: 'QC'}
    - {city: Vancouver, province: 'BC'}
    - {city: Calgary, province: 'AB'}
    - {city: Ottawa, province: 'ON'}
    # Optional per city: name_prefix (defaults to the city in capitals, accents removed),
    # country (defaults to the one above; e.g. US with a two-letter state as province) and
    # station_id to pin a station; a pinned ID must exist and report the required elements.

elements:
  # Which elements flow downstream: those the selected stations report in the inventory, that the
  # readme defines, minus any excluded here.
  exclude: []
  # How to read an element that is absent on a day. Environment Canada only reports a gust above
  # about 31 km/h and snow depth when there is snow, so absence means "nothing to report", not
  # missing data. Everything else defaults to missing.
  absent_means_zero: [WDFG, WSFG, SNWD]
  # Quantities that carry over from day to day (snow on the ground). For these, an absent day is
  # missing, not zero, when snow is evidently there: the readings before and after it are both
  # above zero, or new snow fell that day (fed_by). Found by checking Vancouver against
  # Environment Canada's own record: 4 cm on the ground on 2 February 2025 had no row in NOAA's file.
  persistent:
    SNWD: {fed_by: SNOW}
  # Physical bounds in real units (after scaling), checked in dbt. Values outside are quarantined.
  bounds:
    TMAX: [-60, 50]
    TMIN: [-60, 50]
    TAVG: [-60, 50]
    PRCP: [0, 500]
    SNOW: [0, 1000]
    SNWD: [0, 5000]
    WSFG: [0, 100]
    WDFG: [0, 360]
  # Units for narratives, converted from the readme's units: value * factor.
  display:
    WSFG: {unit: km/h, factor: 3.6}
    SNOW: {unit: cm, factor: 0.1}
    SNWD: {unit: cm, factor: 0.1}

narratives:
  provider: auto                # gemini when GEMINI_API_KEY is set, otherwise the offline mock
  # Tried in order; a model retired for the key (404 NOT_FOUND) falls through to the next.
  # Pinned versions, not "-latest" aliases, which can change behaviour without notice: run
  # `wx eval` before changing a model here. gemini-2.5-flash(-lite) were retired for new keys in
  # October 2026.
  models: [gemini-3.5-flash-lite, gemini-3.8-flash]
  prompt: prompts/narrative_v3.md   # older versions kept for comparison: `wx eval --prompt prompts/narrative_v1.md`
  days: 14                      # most recent days with data, per station
  batch_size: 10                # station-days per request
  # Free-tier limits are per project, shown only in AI Studio, and change; these stay well under
  # them. A 429 waits the delay the API asks for; an exhausted daily quota stops the run cleanly
  # and the next run resumes, because narratives are cached by input.
  requests_per_minute: 5
  max_requests_per_run: 30
  temperature: 0.3
  # A narrative that fails validation goes back to the model once, with its problems listed; if it
  # still fails it's kept, flagged. 0 disables. Costs one extra request per batch of failures.
  repair_attempts: 1
  # Intensity words a narrative may use only when the data supports them, checked as warnings.
  # Thresholds follow Environment Canada's warning criteria where one exists (rainfall 25-50 mm,
  # snowfall 15 cm, wind gusts 70-90 km/h in 24 h, depending on region), set at the lower end.
  # Values are in display units; an element that isn't reported counts as 0. Patterns are regular
  # expressions in single quotes (YAML would treat \b in double quotes as an escape).
  intensity:
    - {pattern: 'heavy\b.{0,30}\b(rain|precipitation)|(rain|precipitation)\b.{0,15}\bheavy|downpour|torrential', element: PRCP, min: 25}
    - {pattern: 'heavy\b.{0,30}\bsnow|snowstorm|blizzard', element: SNOW, min: 15}
    - {pattern: 'bitter(ly)?|frigid|extreme(ly)? cold|deep freeze', element: TMIN, max: -20}
    - {pattern: 'swelter\w*|scorch\w*|heat wave|very hot', element: TMAX, min: 30}
    - {pattern: '(strong|powerful|damaging|fierce)\b.{0,15}\b(gust|wind)', element: WSFG, min: 70}
    - {pattern: 'light winds?|calm|still air', element: WSFG, max: 40}

quality:
  freshness_warn_days: 7        # latest observation older than this: warning
  freshness_error_days: 30      # ... older than this: error, narratives are not generated
  volume_change_warn_pct: 20    # rows per station changed by more than this between loads
