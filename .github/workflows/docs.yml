name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "dbt/**", "config/**", "app/**", "llm/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "dbt/**", "config/**", "app/**", "llm/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

# One GitHub Pages site (https://apmalong.github.io/weather-data-platform/), built from these sources:
#   /         docs/ with MkDocs Material; --strict fails the build on a broken link or anchor
#   /dbt/     dbt's own docs (models, columns, tests, lineage), from a freshly built warehouse so the
#             catalog has every column and type
#   /report/  the results page (wx report) from that warehouse, with Gemini narratives and an
#             evaluation of the current prompt. The key is a repository secret, never used on pull
#             requests; without it (deleted, retired, out of quota) narratives fall back to the
#             offline mock and the evaluation is skipped, so the site still deploys.
#   /data/warehouse.duckdb  that warehouse itself, read-only, queryable from any DuckDB client
#   /query/   a page that queries it in the browser with DuckDB-WASM (docs/query/index.html)
# Pages serves one site per repo, so all of it is built and deployed together here; a second workflow
# deploying to Pages would overwrite this one. Pull requests build but don't deploy.
# Actions are pinned to commit SHAs (the version in the comment): a tag can be moved to other code,
# and this workflow holds the Gemini key and can deploy the site.
permissions:
  contents: read   # the build job runs third-party packages, so only deploy may write to Pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no later step needs the token in .git/config
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group docs
      - name: Build the warehouse (ingest from NOAA, then dbt build) for the dbt catalog
        run: |
          uv run wx ingest
          uv run wx transform
      - name: Narratives (Gemini; the mock if Gemini is unavailable)
        env:
          GEMINI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.GEMINI_API_KEY || '' }}
        run: uv run wx narrate || uv run wx narrate --provider mock
      - name: Evaluate the current prompt (the report's Evaluation tab)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.GEMINI_API_KEY || '' }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then uv run wx eval; else echo "No key, so the evaluation is skipped"; fi
      - name: dbt docs (one self-contained page)
        working-directory: dbt
        run: uv run dbt docs generate --static --profiles-dir .
      - name: MkDocs site
        run: uv run mkdocs build --strict
      - name: Add the dbt docs under /dbt/ and the report under /report/
        run: |
          mkdir -p site/dbt site/data
          cp dbt/target/static_index.html site/dbt/index.html
          uv run wx report --out site/report/index.html
      - name: Publish the warehouse under /data/ (refuses if anything looks like a credential)
        run: |
          uv run python - <<'EOF'
          import duckdb, shutil
          conn = duckdb.connect("data/warehouse.duckdb")
          conn.execute("checkpoint")   # fold the write-ahead log into the file
          columns = conn.execute("""select table_schema, table_name, column_name from information_schema.columns
                                      where data_type in ('VARCHAR', 'JSON')""").fetchall()
          key_pattern = "AIza[0-9A-Za-z_-]{30,}"   # the shape of a Google API key
          for schema, table, column in columns:
              query = f'select count(*) from "{schema}"."{table}" where regexp_matches("{column}"::varchar, ?)'
              hits = conn.execute(query, [key_pattern]).fetchone()[0]
              assert hits == 0, f"{schema}.{table}.{column} contains something that looks like an API key"
          conn.close()
          shutil.copy("data/warehouse.duckdb", "site/data/warehouse.duckdb")
          print(f"{len(columns)} text columns checked; warehouse published")
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
