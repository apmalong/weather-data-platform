name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "dbt/**", "config/**", "app/**", "llm/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "dbt/**", "config/**", "app/**", "llm/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

# One GitHub Pages site (https://apmalong.github.io/weather-data-platform/), built from three sources:
#   /         docs/ with MkDocs Material; --strict fails the build on a broken link or anchor
#   /dbt/     dbt's own docs (models, columns, tests, lineage), from a freshly built warehouse so the
#             catalog has every column and type
#   /report/  the results page (wx report) from that warehouse, with Gemini narratives and an
#             evaluation of the current prompt. The key is a repository secret, never used on pull
#             requests; without it (deleted, retired, out of quota) narratives fall back to the
#             offline mock and the evaluation is skipped, so the site still deploys.
# Pages serves one site per repo, so all three are built and deployed together here; a second workflow
# deploying to Pages would overwrite this one. Pull requests build but don't deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group docs
      - name: Build the warehouse (ingest from NOAA, then dbt build) for the dbt catalog
        run: |
          uv run wx ingest
          uv run wx transform
      - name: Narratives (Gemini; the mock if Gemini is unavailable)
        env:
          GEMINI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.GEMINI_API_KEY || '' }}
        run: uv run wx narrate || uv run wx narrate --provider mock
      - name: Evaluate the current prompt (the report's Evaluation tab)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.GEMINI_API_KEY || '' }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then uv run wx eval; else echo "No key, so the evaluation is skipped"; fi
      - name: dbt docs (one self-contained page)
        working-directory: dbt
        run: uv run dbt docs generate --static --profiles-dir .
      - name: MkDocs site
        run: uv run mkdocs build --strict
      - name: Add the dbt docs under /dbt/ and the report under /report/
        run: |
          mkdir -p site/dbt
          cp dbt/target/static_index.html site/dbt/index.html
          uv run wx report --out site/report/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
