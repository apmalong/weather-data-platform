name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Proves the README's reproduction steps on a clean machine: install from the lockfile, lint, unit
# tests, then the whole pipeline against live NOAA data. No GEMINI_API_KEY is configured, so
# narratives use the offline mock provider; the connector's Gemini paths are covered by unit tests
# with a fake client.
jobs:
  pipeline:
    # The same commands on all three systems a grader might use. Runner images are pinned:
    # ubuntu-latest moves to 26 on 2026-10-19.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash   # Git Bash on Windows, so every step runs identically
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tag is published
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Python style (black formats, ruff lints)
        if: runner.os == 'Linux'   # formatting doesn't depend on the OS
        run: |
          uv run black --check app orchestration
          uv run ruff check .
      - name: SQL style (Matt Mazur's guide, via sqlfluff)
        if: runner.os == 'Linux'
        run: uv run sqlfluff lint dbt/models dbt/tests
      - run: uv run pytest
      - name: Pipeline end to end (ingest, dbt build with tests, narratives with validation)
        run: uv run wx run
      - name: Health report
        run: uv run wx health --out health_report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            health_report.md
            data/report.html
          if-no-files-found: ignore
