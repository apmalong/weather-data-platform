[project]
name = "weather-data-platform"
version = "0.1.0"
description = "NOAA GHCN-Daily pipeline for Canadian airport stations: metadata-driven ingest, dbt on DuckDB, Gemini daily narratives."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.4.3",
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "google-genai>=1.0",
]

[project.scripts]
wx = "wx.cli:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=8",
    "ruff>=0.6",
    "sqlfluff>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wx"]

[tool.black]
# Formatting is black's; ruff only lints. Same line length for both.
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
